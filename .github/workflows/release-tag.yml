name: Accounting Deployment
run-name: ${{ inputs.redeploy && 'Redeploy' || 'Deploy' }} ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag to deploy.
        required: true
        type: string
      release_sha:
        description: Expected full commit SHA for an automatically dispatched release.
        required: false
        type: string
      redeploy:
        description: Distinguish a manual stable-tag redeploy from the initial deployment.
        default: true
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: accounting-production
  cancel-in-progress: false

env:
  ACCOUNTING_API_IMAGE_NAME: homebudget-accounting-api
  ACCOUNTING_WORKER_IMAGE_NAME: homebudget-accounting-payments-consumer-worker

jobs:
  verify-release:
    name: Verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - id: release
        name: Validate tag, source, and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the stable vMAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --force --tags origin
          git fetch origin master --depth=1
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$release_sha" ]]; then
            echo "Checked-out commit does not match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_RELEASE_SHA" && "$EXPECTED_RELEASE_SHA" != "$release_sha" ]]; then
            echo "Supplied release SHA does not match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" origin/master; then
            echo "Release tag $RELEASE_TAG is not reachable from master." >&2
            exit 1
          fi

          release_target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')"
          release_target_sha="$(git rev-parse "$release_target^{commit}" 2>/dev/null || true)"
          if [[ "$release_target" != "$release_sha" && "$release_target_sha" != "$release_sha" ]]; then
            echo "GitHub Release $RELEASE_TAG does not identify the tagged commit." >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build-api-image:
    name: Build Accounting API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-release
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Accounting API image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          target: final
          build-args: |
            BUILD_VERSION=${{ needs.verify-release.outputs.release_tag }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ACCOUNTING_API_IMAGE_NAME }}:${{ needs.verify-release.outputs.release_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ACCOUNTING_API_IMAGE_NAME }}:sha-${{ needs.verify-release.outputs.release_sha }}
          labels: |
            org.opencontainers.image.title=${{ env.ACCOUNTING_API_IMAGE_NAME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-release.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.release_tag }}
          outputs: type=docker,dest=/tmp/accounting-api-image.tar
          cache-from: type=gha,scope=accounting-api-release
          cache-to: type=gha,mode=max,scope=accounting-api-release

      - name: Upload Accounting API image artifact
        uses: actions/upload-artifact@v5
        with:
          name: accounting-api-image-${{ needs.verify-release.outputs.release_tag }}
          path: /tmp/accounting-api-image.tar
          retention-days: 1
          if-no-files-found: error

  push-api-image:
    name: Publish Accounting API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-release, build-api-image]
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Download Accounting API image artifact
        uses: actions/download-artifact@v5
        with:
          name: accounting-api-image-${{ needs.verify-release.outputs.release_tag }}
          path: docker-artifacts/api

      - name: Load Accounting API image
        shell: bash
        run: docker load --input docker-artifacts/api/accounting-api-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: publish
        name: Validate and publish immutable API tags
        shell: bash
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ACCOUNTING_API_IMAGE_NAME }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          version_ref="$IMAGE_NAME:$RELEASE_TAG"
          sha_ref="$IMAGE_NAME:sha-$RELEASE_SHA"

          inspect_tag() {
            local image_ref="$1"
            local inspection=''
            if inspection="$(docker manifest inspect "$image_ref" 2>&1)"; then
              docker pull "$image_ref" >/dev/null
              local revision
              local version
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
              version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")"
              if [[ "$revision" != "$RELEASE_SHA" || "$version" != "$RELEASE_TAG" ]]; then
                echo "Existing image tag points to a different release: $image_ref" >&2
                exit 1
              fi
              echo true
            elif [[ "$inspection" == *'no such manifest'* || "$inspection" == *'manifest unknown'* ]]; then
              echo false
            else
              echo "Unable to confirm Docker image tag $image_ref is unused: $inspection" >&2
              exit 1
            fi
          }

          version_exists="$(inspect_tag "$version_ref")"
          sha_exists="$(inspect_tag "$sha_ref")"
          if [[ "$version_exists" != "$sha_exists" ]]; then
            echo 'Only one immutable image tag exists; refusing an inconsistent release.' >&2
            exit 1
          fi
          if [[ "$version_exists" == false ]]; then
            docker push "$version_ref"
            docker push "$sha_ref"
          fi

          docker pull "$version_ref" >/dev/null
          digest="$(docker image inspect "$version_ref" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          [[ -n "$digest" ]]
          echo "image_ref=$version_ref" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  build-worker-image:
    name: Build Accounting worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-release
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Accounting worker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HomeBudget.Accounting.Workers.OperationsConsumer/Dockerfile
          target: final
          build-args: |
            BUILD_VERSION=${{ needs.verify-release.outputs.release_tag }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ACCOUNTING_WORKER_IMAGE_NAME }}:${{ needs.verify-release.outputs.release_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ACCOUNTING_WORKER_IMAGE_NAME }}:sha-${{ needs.verify-release.outputs.release_sha }}
          labels: |
            org.opencontainers.image.title=${{ env.ACCOUNTING_WORKER_IMAGE_NAME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-release.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.release_tag }}
          outputs: type=docker,dest=/tmp/accounting-worker-image.tar
          cache-from: type=gha,scope=accounting-worker-release
          cache-to: type=gha,mode=max,scope=accounting-worker-release

      - name: Upload Accounting worker image artifact
        uses: actions/upload-artifact@v5
        with:
          name: accounting-worker-image-${{ needs.verify-release.outputs.release_tag }}
          path: /tmp/accounting-worker-image.tar
          retention-days: 1
          if-no-files-found: error

  push-worker-image:
    name: Publish Accounting worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-release, build-worker-image]
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Download Accounting worker image artifact
        uses: actions/download-artifact@v5
        with:
          name: accounting-worker-image-${{ needs.verify-release.outputs.release_tag }}
          path: docker-artifacts/worker

      - name: Load Accounting worker image
        shell: bash
        run: docker load --input docker-artifacts/worker/accounting-worker-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: publish
        name: Validate and publish immutable worker tags
        shell: bash
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ACCOUNTING_WORKER_IMAGE_NAME }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          version_ref="$IMAGE_NAME:$RELEASE_TAG"
          sha_ref="$IMAGE_NAME:sha-$RELEASE_SHA"

          inspect_tag() {
            local image_ref="$1"
            local inspection=''
            if inspection="$(docker manifest inspect "$image_ref" 2>&1)"; then
              docker pull "$image_ref" >/dev/null
              local revision
              local version
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
              version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")"
              if [[ "$revision" != "$RELEASE_SHA" || "$version" != "$RELEASE_TAG" ]]; then
                echo "Existing image tag points to a different release: $image_ref" >&2
                exit 1
              fi
              echo true
            elif [[ "$inspection" == *'no such manifest'* || "$inspection" == *'manifest unknown'* ]]; then
              echo false
            else
              echo "Unable to confirm Docker image tag $image_ref is unused: $inspection" >&2
              exit 1
            fi
          }

          version_exists="$(inspect_tag "$version_ref")"
          sha_exists="$(inspect_tag "$sha_ref")"
          if [[ "$version_exists" != "$sha_exists" ]]; then
            echo 'Only one immutable image tag exists; refusing an inconsistent release.' >&2
            exit 1
          fi
          if [[ "$version_exists" == false ]]; then
            docker push "$version_ref"
            docker push "$sha_ref"
          fi

          docker pull "$version_ref" >/dev/null
          digest="$(docker image inspect "$version_ref" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          [[ -n "$digest" ]]
          echo "image_ref=$version_ref" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  record-deployment:
    name: ${{ inputs.redeploy && 'Redeploy' || 'Deploy' }} ${{ needs.verify-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs: [verify-release, build-api-image, push-api-image, build-worker-image, push-worker-image]
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Record deployed release metadata
        if: ${{ needs.verify-release.result == 'success' && needs.push-api-image.result == 'success' && needs.push-worker-image.result == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
          API_IMAGE: ${{ needs.push-api-image.outputs.image_ref }}
          API_DIGEST: ${{ needs.push-api-image.outputs.image_digest }}
          WORKER_IMAGE: ${{ needs.push-worker-image.outputs.image_ref }}
          WORKER_DIGEST: ${{ needs.push-worker-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cat > release-artifacts/release-metadata.json <<EOF
          {
            "release_tag": "$RELEASE_TAG",
            "commit_sha": "$RELEASE_SHA",
            "source_ref": "refs/tags/$RELEASE_TAG",
            "workflow_run_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "environment": "production",
            "images": [
              { "name": "api", "image_ref": "$API_IMAGE", "digest": "$API_DIGEST" },
              { "name": "worker", "image_ref": "$WORKER_IMAGE", "digest": "$WORKER_DIGEST" }
            ]
          }
          EOF

          gh release view "$RELEASE_TAG" --json body --jq '.body' > release-notes.md
          sed '/<!-- accounting-release-trace:start -->/,/<!-- accounting-release-trace:end -->/d' release-notes.md > updated-release-notes.md
          cat >> updated-release-notes.md <<EOF

          <!-- accounting-release-trace:start -->
          ## Accounting deployment traceability

          - Commit: \`$RELEASE_SHA\`
          - Environment: \`production\`
          - Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - API: \`$API_IMAGE@$API_DIGEST\`
          - Worker: \`$WORKER_IMAGE@$WORKER_DIGEST\`
          <!-- accounting-release-trace:end -->
          EOF
          gh release edit "$RELEASE_TAG" --notes-file updated-release-notes.md

      - name: Upload release metadata
        if: ${{ needs.verify-release.result == 'success' && needs.push-api-image.result == 'success' && needs.push-worker-image.result == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ needs.verify-release.outputs.release_tag }}
          path: release-artifacts/release-metadata.json
          retention-days: 30
          if-no-files-found: error

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "# ${{ inputs.redeploy && 'Redeploy' || 'Deploy' }} ${{ needs.verify-release.outputs.release_tag || inputs.release_tag }}"
            echo
            echo '| Property | Value |'
            echo '|---|---|'
            echo "| Commit | \`${{ needs.verify-release.outputs.release_sha }}\` |"
            echo '| Environment | `production` |'
            echo "| API image | \`${{ needs.push-api-image.outputs.image_ref }}@${{ needs.push-api-image.outputs.image_digest }}\` |"
            echo "| Worker image | \`${{ needs.push-worker-image.outputs.image_ref }}@${{ needs.push-worker-image.outputs.image_digest }}\` |"
            echo "| Release validation | \`${{ needs.verify-release.result }}\` |"
            echo "| API publication | \`${{ needs.push-api-image.result }}\` |"
            echo "| Worker publication | \`${{ needs.push-worker-image.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail deployment when a mandatory stage failed
        if: ${{ needs.verify-release.result != 'success' || needs.push-api-image.result != 'success' || needs.push-worker-image.result != 'success' }}
        shell: bash
        run: |
          echo 'A mandatory release stage failed; production deployment is not successful.' >&2
          exit 1
