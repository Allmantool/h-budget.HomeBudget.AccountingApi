name: Accounting Release
run-name: Accounting release ${{ github.sha }}

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: accounting-release-master
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci-master.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      actions: write
      contents: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_sha: ${{ steps.publish.outputs.release_sha }}
      previous_tag: ${{ steps.publish.outputs.previous_tag }}
    steps:
      - name: Check out verified master revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering revision
        shell: bash
        env:
          TRIGGERING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TRIGGERING_SHA" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - id: publish
        name: Create immutable tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --points-at HEAD --list 'v*' | sort > tags-before.txt
          previous_tag="$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1 || true)"

          npx --no-install semantic-release
          git fetch --force --tags origin
          git tag --points-at HEAD --list 'v*' | sort > tags-after.txt

          release_tag="$(comm -13 tags-before.txt tags-after.txt)"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort | head -n 1 || true)"
          fi
          if [[ -z "$release_tag" ]]; then
            exit 0
          fi
          if [[ "$release_tag" == *$'\n'* || ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "semantic-release created an invalid stable tag: $release_tag" >&2
            exit 1
          fi

          release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          if [[ "$release_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "Release tag $release_tag does not point to the verified commit." >&2
            exit 1
          fi

          if gh release view "$release_tag" --json targetCommitish --jq '.targetCommitish' > release-target.txt 2>/dev/null; then
            release_target="$(<release-target.txt)"
            release_target_sha="$(git rev-parse "$release_target^{commit}" 2>/dev/null || true)"
            if [[ "$release_target" != "$release_sha" && "$release_target_sha" != "$release_sha" ]]; then
              echo "GitHub Release $release_tag identifies a different commit." >&2
              exit 1
            fi
          else
            gh release create "$release_tag" \
              --target "$release_sha" \
              --title "Accounting $release_tag" \
              --generate-notes
          fi

          {
            echo "release_tag=$release_tag"
            echo "release_sha=$release_sha"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch versioned deployment
        if: steps.publish.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh workflow run release-tag.yml --ref master \
            --field release_tag="$RELEASE_TAG" \
            --field release_sha="$RELEASE_SHA" \
            --field redeploy=false

      - name: Write release summary
        if: always()
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.publish.outputs.release_sha }}
          PREVIOUS_TAG: ${{ steps.publish.outputs.previous_tag }}
        run: |
          if [[ "$PUBLISH_OUTCOME" != 'success' ]]; then
            echo '# Accounting release publication failed' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            echo '# No Accounting release required' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "# Accounting Release $RELEASE_TAG"
            echo
            echo '| Property | Value |'
            echo '|---|---|'
            echo "| Commit | \`$RELEASE_SHA\` |"
            echo "| Previous release | \`${PREVIOUS_TAG:-none}\` |"
            echo '| Deployment | dispatched |'
            echo
            echo "[View GitHub Release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
